swagger: "2.0"
info:
  version: v1
  title: Opus Dental API
  description: |
    **⚠️ End of life notice:** This API is deprecated and will be replaced by
    Opus API v2. Do not build new integrations against v1 endpoints.
    Contact us for information on the v2 timeline.
host: tenantID.opusdentalonline.com
basePath: /api/public/v1
schemes:
  - https
paths:
  /auth/clinic/login:
    get:
      tags:
        - Authentication
      operationId: AuthenticationV1_Login
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: accountId
          in: query
          required: true
          type: string
          format: uuid
        - name: apiKey
          in: query
          required: true
          type: string
        - name: clinicOnlineIds
          in: query
          required: true
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: isLogin
          in: query
          required: true
          type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/System.ValueTuple[System.String,System.String]"
  /appointments/schedule/overview/availabletimes:
    get:
      tags:
        - Availability
      operationId: AppointmentsV1_GetOverView
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.from
          in: query
          required: false
          type: string
          format: date-time
        - name: request.to
          in: query
          required: false
          type: string
          format: date-time
        - name: request.clinicID
          in: query
          required: false
          type: string
        - name: request.clinicianID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.treatmentID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.groupName
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.TimeSlotDTO"
  /appointments/schedule/availabletimes:
    get:
      tags:
        - Availability
      operationId: AppointmentsV1_GetAvailableTimesForScheduling
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.from
          in: query
          required: false
          type: string
          format: date-time
        - name: request.to
          in: query
          required: false
          type: string
          format: date-time
        - name: request.treatmentID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.clinicID
          in: query
          required: false
          type: string
        - name: request.clinicianID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.groupName
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.TimeSlotDTO"
  /appointments/reschedule/availabletimes:
    get:
      tags:
        - Availability
      operationId: AppointmentsV1_GetAvailableTimesForRescheduling
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.from
          in: query
          required: false
          type: string
          format: date-time
        - name: request.to
          in: query
          required: false
          type: string
          format: date-time
        - name: request.treatmentID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.timeslotLength
          in: query
          required: false
          type: integer
          format: int32
        - name: request.clinicID
          in: query
          required: false
          type: string
        - name: request.clinicianID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.groupName
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.TimeSlotDTO"
  /portal/arrival-registration/appointments/today/{DateOfBirth}:
    get:
      tags:
        - Arrival registration
      operationId: ArrivalRegistrationV1_GetTodaysAppointmentsByDateOfBirth
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: dateOfBirth
          in: query
          required: true
          type: string
        - name: request.dateOfBirth
          in: query
          required: false
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.ArrivalRegistration.Ap\
                pointmentDto"
  /portal/arrival-registration/check-in:
    patch:
      tags:
        - Arrival registration
      operationId: ArrivalRegistrationV1_RegisterPatientArrivalAtClinic
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.bookingId
          in: query
          required: false
          type: integer
          format: int32
        - name: request.clinicId
          in: query
          required: false
          type: string
        - name: request.patientPersonalIdentification
          in: query
          required: false
          type: string
        - name: request.personalIdentification.year
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.month
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.day
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.extraDigits
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
  /portal/arrival-registration/settings:
    get:
      tags:
        - Arrival registration
      operationId: ArrivalRegistrationV1_GetArrivalRegistrationSettings
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Model.Settings.FeatureSettings.A\
              rrivalRegistrationFeatureSettings"
  
  /bi/campaignmanager/{Year}:
    get:
      tags:
        - Business Intelligence
      operationId: BiV1_GetPatientRevenue
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: year
          in: query
          required: true
          type: string
        - name: request.year
          in: query
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.PatientRevenueDto"
  /bi/trustbuilder:
    get:
      tags:
        - Business Intelligence
      operationId: BiV1_GetPatientsActiveBookings
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.fromDate
          in: query
          required: false
          type: string
          format: date-time
        - name: request.toDate
          in: query
          required: false
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.PatientBookingDto"
  /bi/activebookings:
    get:
      tags:
        - Business Intelligence
      operationId: BiV1_GetPatientsActiveBookings
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.fromDate
          in: query
          required: false
          type: string
          format: date-time
        - name: request.toDate
          in: query
          required: false
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.PatientBookingDto"
 
  /bookings:
    post:
      tags:
        - Bookings
      operationId: BookingsV1_AddBooking
      consumes:
        - application/json
        - text/json
        - application/xml
        - text/xml
        - application/x-www-form-urlencoded
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: booking
          in: body
          required: true
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.BookingDTO"
        - name: notifyPatient
          in: query
          required: false
          type: boolean
        - name: activatePatient
          in: query
          required: false
          type: boolean
      responses:
        "200":
          description: OK
          schema:
            format: int32
            type: integer
    delete:
      tags:
        - Bookings
      operationId: BookingsV1_CancelBooking
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.bookingID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.clinicID
          in: query
          required: false
          type: string
        - name: request.requestedBy
          in: query
          required: false
          type: string
        - name: request.requestedByPersonalId.year
          in: query
          required: false
          type: integer
          format: int32
        - name: request.requestedByPersonalId.month
          in: query
          required: false
          type: integer
          format: int32
        - name: request.requestedByPersonalId.day
          in: query
          required: false
          type: integer
          format: int32
        - name: request.requestedByPersonalId.extraDigits
          in: query
          required: false
          type: string
        - name: request.notifyPatient
          in: query
          required: false
          type: boolean
      responses:
        "200":
          description: OK
          schema:
            type: object
    patch:
      tags:
        - Bookings
      operationId: BookingsV1_RescheduleBooking
      consumes:
        - application/json
        - text/json
        - application/xml
        - text/xml
        - application/x-www-form-urlencoded
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: booking
          in: body
          required: true
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.RescheduleDTO"
        - name: notifyPatient
          in: query
          required: false
          type: boolean
      responses:
        "200":
          description: OK
          schema:
            format: int32
            type: integer
  /clinicians:
    get:
      tags:
        - Clinicians
      operationId: CliniciansV1_GetClinicians
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.clinicID
          in: query
          required: false
          type: string
        - name: request.treatmentID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.onlyWithFreeTimes
          in: query
          required: false
          type: boolean
        - name: request.groupName
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.ClinicianDTO"
  
  /clinics:
    get:
      tags:
        - Clinics
      operationId: ClinicsV1_GetClinics
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: request.clinicianID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.treatmentID
          in: query
          required: false
          type: integer
          format: int32
        - name: request.onlyWithFreeTimes
          in: query
          required: false
          type: boolean
        - name: request.groupName
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.ClinicDTO"
  /clinics/{id}:
    get:
      tags:
        - Clinics
      operationId: ClinicsV1_GetClinic
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.ClinicDTO"
  /clinics/accounts:
    get:
      description: "Gets the registered bank account numbers for all clinics connected to the itb account."
      tags:
        - Clinics
      operationId: ClinicsV1_GetClinicAccounts
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.ClinicAccountDTO"
  /clinics/{clinicId}/patients/{patientPersonalIdentification}/arrival:
    patch:
      description: |
        Registers the arrival of the specified patient for it´s appointment at the specified clinic. 
        Sets the arrival flag for all of the patient´s bookings for the current day on the specified clinic.
      tags:
        - Arrival registration
      operationId: ClinicsV1_RegisterPatientArrivalAtClinic
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: clinicId
          in: path
          required: true
          type: string
        - name: patientPersonalIdentification
          in: path
          required: true
          type: string
        - name: request.clinicID
          in: query
          required: false           
          type: string
        - name: request.patientPersonalIdentification
          in: query
          required: false
          type: string
        - name: request.personalIdentification.year
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.month
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.day
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.extraDigits
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
  /clinics/{ClinicOnlineId}/invoices/exportable:
    get:
      tags:
        - Billing
      operationId: ClinicsV1_GetClinicExportableInvoices
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: clinicOnlineId
          in: query
          required: true
          type: string
        - name: request.dueAfter
          in: query
          required: false
          type: string
          format: date-time
        - name: request.dueBefore
          in: query
          required: false
          type: string
          format: date-time
        - name: request.maxStatus
          in: query
          required: false
          type: integer
          format: int32
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - -2
            - -1
        - name: request.subscriptionFilter
          in: query
          required: false
          type: integer
          format: int32
          enum:
            - 0
            - 1
            - 2
        - name: request.createdAfter
          in: query
          required: false
          type: string
          format: date-time
        - name: request.createdBefore
          in: query
          required: false
          type: string
          format: date-time
        - name: request.clinicOnlineId
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.Invoices.InvoiceOnlineRefe\
                rence"
  /clinics/{clinicOnlineId}/settlements:
    post:
      tags:
        - Billing
      operationId: ClinicsV1_RegisterSettlement
      consumes:
        - application/json
        - text/json
        - application/xml
        - text/xml
        - application/x-www-form-urlencoded
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: clinicOnlineId
          in: path
          required: true
          type: string
        - name: request
          in: body
          required: true
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Frontend.Web.Core.AppServices.Fe\
              atures.Clinics.RegisterSettlement.Request"
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Features.Clinics.Settlements.Set\
              tlementDto"
  /clinics/{ClinicOnlineId}/settlements/{Id}:
    get:
      tags:
        - Billing
      operationId: ClinicsV1_ViewSettlement
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: clinicOnlineId
          in: query
          required: true
          type: string
        - name: id
          in: query
          required: true
          type: string
        - name: request.id
          in: query
          required: false
          type: integer
          format: int32
        - name: request.clinicOnlineId
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Features.Clinics.Settlements.Set\
              tlementDto"
  /companies/invoices/{InvoiceOnlineId}:
    get:
      tags:
        - Billing
      operationId: CompaniesV1_GetSpecificCompanyInvoice
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: InvoiceOnlineId
          in: path
          required: true
          type: string
        - name: request.anonymize
          in: query
          required: false
          type: boolean
        - name: request.invoiceOnlineId
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.CompanyInvoiceDto"
  
  /guardians/{guardianPersonalIdentification}/patients:
    get:
      tags:
        - Guardians
      operationId: GuardiansV1_GetGuardianPatients
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: guardianPersonalIdentification
          in: path
          required: true
          type: string
        - name: request.guardianPersonalIdentification
          in: query
          required: false
          type: string
        - name: request.guardianPersonalIdentificationParsed.year
          in: query
          required: false
          type: integer
          format: int32
        - name: request.guardianPersonalIdentificationParsed.month
          in: query
          required: false
          type: integer
          format: int32
        - name: request.guardianPersonalIdentificationParsed.day
          in: query
          required: false
          type: integer
          format: int32
        - name: request.guardianPersonalIdentificationParsed.extraDigits
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.GuardianPatientDTO"
  /guardians/{guardianPersonalIdentification}/patients/{patientPersonalIdentification}/access/{hasAccess}:
    patch:
      tags:
        - Guardians
      operationId: GuardiansV1_SetGuardianAccess
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: guardianPersonalIdentification
          in: path
          required: true
          type: string
        - name: patientPersonalIdentification
          in: path
          required: true
          type: string
        - name: hasAccess
          in: path
          required: true
          type: string
        - name: guardianAccess.guardianPersonalNumber.year
          in: query
          required: false
          type: integer
          format: int32
        - name: guardianAccess.guardianPersonalNumber.month
          in: query
          required: false
          type: integer
          format: int32
        - name: guardianAccess.guardianPersonalNumber.day
          in: query
          required: false
          type: integer
          format: int32
        - name: guardianAccess.guardianPersonalNumber.extraDigits
          in: query
          required: false
          type: string
        - name: guardianAccess.patientPersonalNumber.year
          in: query
          required: false
          type: integer
          format: int32
        - name: guardianAccess.patientPersonalNumber.month
          in: query
          required: false
          type: integer
          format: int32
        - name: guardianAccess.patientPersonalNumber.day
          in: query
          required: false
          type: integer
          format: int32
        - name: guardianAccess.patientPersonalNumber.extraDigits
          in: query
          required: false
          type: string
        - name: guardianAccess.hasAccess
          in: query
          required: false
          type: boolean
      responses:
        "200":
          description: OK
          schema:
            type: object
  /guardians/{guardianPersonalIdentification}/bookings:
    get:
      tags:
        - Guardians
      operationId: GuardiansV1_GetGuardianPatientBookings
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: guardianPersonalIdentification
          in: path
          required: true
          type: string
        - name: request.guardianPersonalIdentification
          in: query
          required: false
          type: string
        - name: request.guardianPersonalIdentificationParsed.year
          in: query
          required: false
          type: integer
          format: int32
        - name: request.guardianPersonalIdentificationParsed.month
          in: query
          required: false
          type: integer
          format: int32
        - name: request.guardianPersonalIdentificationParsed.day
          in: query
          required: false
          type: integer
          format: int32
        - name: request.guardianPersonalIdentificationParsed.extraDigits
          in: query
          required: false
          type: string
        - name: request.includePastBookings
          in: query
          required: false
          type: boolean
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Opus.Online.OnlineBooking.Model.DTO.BookingDTOExtended"
  /portal/health-declaration/{patientPersonalIdentification}:
    get:
      tags:
        - Health Declaration
      operationId: HealthDeclarationV1_GetHealthcare
      consumes: []
      produces:
        - application/json
        - text/json
        - application/xml
        - text/xml
      parameters:
        - name: patientPersonalIdentification
          in: path
          required: true
          type: string
        - name: request.patientPersonalIdentification
          in: query
          required: false
          type: string
        - name: request.personalIdentification.year
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.month
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.day
          in: query
          required: false
          type: integer
          format: int32
        - name: request.personalIdentification.extraDigits
          in: query
          required: false
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Opus.Online.OnlineBooking.Model.Health.DTO.HealthDeclarati\
              onDTO"
    patch:
      tags:
        - Health Declaration
      operationId: HealthDeclarationV1_RegisterHealthcare
